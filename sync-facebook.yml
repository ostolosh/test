name: Синхронізація новин з Facebook

on:
  schedule:
    - cron: "0 5,14 * * *"   # двічі на день (UTC)
  workflow_dispatch: {}        # кнопка "Run workflow" для ручного запуску

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Завантажити публікації
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node scripts/sync-facebook.mjs
      - name: Надіслати нові новини в месенджери
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIBER_AUTH_TOKEN: ${{ secrets.VIBER_AUTH_TOKEN }}
          VIBER_FROM: ${{ secrets.VIBER_FROM }}
        run: node scripts/notify-messengers.mjs
      - name: Зберегти зміни
        run: |
          git config user.name "lyceum-bot"
          git config user.email "lyceum-bot@users.noreply.github.com"
          git add posts.json images data/notified.json
          if git diff --cached --quiet; then
            echo "Змін немає"
          else
            git commit -m "Оновлення новин з Facebook"
            git push
          fi
