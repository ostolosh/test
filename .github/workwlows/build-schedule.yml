name: Оновлення розкладу й календарів

# Запускається, коли хтось змінює data/schedule.csv (наприклад, завантажив новий файл на GitHub).
on:
  push:
    branches: [main, root]
    paths:
      - "data/schedule.csv"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Створити schedule.json і календарі класів
        run: |
          node scripts/schedule-from-csv.mjs
          node scripts/make-calendars.mjs
      - name: Зберегти зміни
        run: |
          git config user.name "lyceum-bot"
          git config user.email "lyceum-bot@users.noreply.github.com"
          git add schedule.json calendar
          if git diff --cached --quiet; then
            echo "Змін немає"
          else
            git commit -m "Оновлення розкладу й календарів"
            git push
          fi
