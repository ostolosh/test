name: Новини в Telegram і Viber

# Запускається, коли в адмін-панелі збережено нову новину (posts-manual.json).
# Новини з Facebook надсилаються з workflow синхронізації.
on:
  push:
    branches: [main]
    paths:
      - "posts-manual.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: notify-messengers
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Надіслати нові новини
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIBER_AUTH_TOKEN: ${{ secrets.VIBER_AUTH_TOKEN }}
          VIBER_FROM: ${{ secrets.VIBER_FROM }}
        run: node scripts/notify-messengers.mjs
      - name: Зберегти список надісланого
        run: |
          git config user.name "lyceum-bot"
          git config user.email "lyceum-bot@users.noreply.github.com"
          git add data/notified.json
          if git diff --cached --quiet; then echo "Змін немає"; else git commit -m "Оновлено список надісланих новин"; git pull --rebase; git push; fi
